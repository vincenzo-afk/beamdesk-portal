[package]
name = "beamdesk-linux-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Attended-only Linux host shell for BeamDesk remote support"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
eventsource-stream = "0.2"
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-sdp = "0.24"
gstreamer-webrtc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
pretty_assertions = "1"
